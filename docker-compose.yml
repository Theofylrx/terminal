version: '3.8'

# Terminal Trading System - Docker Compose Configuration
# Development Environment

services:
  # ==================== DATABASES & INFRASTRUCTURE ====================

  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: terminal-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-terminal_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - terminal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: terminal-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - terminal_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: terminal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-trading}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-changeme}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - terminal_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # ==================== MONITORING ====================

  prometheus:
    image: prom/prometheus:latest
    container_name: terminal-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - terminal_network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: terminal-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - terminal_network
    restart: unless-stopped

  # ==================== API GATEWAY ====================

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: terminal-gateway
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AUTH_SERVICE_URL=http://auth-service:8000
      - TRADING_SERVICE_URL=http://trading-service:8000
      - ANALYTICS_SERVICE_URL=http://analytics-service:8000
      - STRATEGY_SERVICE_URL=http://strategy-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app/gateway:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== BACKEND SERVICES ====================

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: terminal-auth
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change_this_secret_key_in_production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app/services/auth-service:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  trading-service:
    build:
      context: .
      dockerfile: services/trading-service/Dockerfile
    container_name: terminal-trading
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    ports:
      - "8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/trading-service:/app/services/trading-service:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==================== TRADING AGENTS ====================

  market-data-service:
    build:
      context: .
      dockerfile: agents/market-data-service/Dockerfile
    container_name: terminal-market-data
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Alpaca (stocks)
      - ENABLE_ALPACA=${ENABLE_ALPACA:-false}
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      # Binance (crypto)
      - ENABLE_BINANCE=${ENABLE_BINANCE:-false}
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_TESTNET=${BINANCE_TESTNET:-true}
      # OANDA (forex)
      - ENABLE_OANDA=${ENABLE_OANDA:-false}
      - OANDA_API_KEY=${OANDA_API_KEY:-}
      - OANDA_ACCOUNT_ID=${OANDA_ACCOUNT_ID:-}
    ports:
      - "8003:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./agents/market-data-service:/app/agents/market-data-service:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  technical-analyst-service:
    build:
      context: .
      dockerfile: agents/technical-analyst-service/Dockerfile
    container_name: terminal-technical-analyst
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Indicator parameters
      - RSI_PERIOD=${RSI_PERIOD:-14}
      - MACD_FAST=${MACD_FAST:-12}
      - MACD_SLOW=${MACD_SLOW:-26}
      - MIN_CONFIDENCE=${MIN_CONFIDENCE:-60.0}
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_healthy
    volumes:
      - ./agents/technical-analyst-service:/app/agents/technical-analyst-service:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Can scale: docker-compose up -d --scale technical-analyst-service=3

  executor-service:
    build:
      context: .
      dockerfile: agents/executor-service/Dockerfile
    container_name: terminal-executor
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-trading}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      # Broker API Credentials - Alpaca
      - ALPACA_API_KEY=${ALPACA_API_KEY:-}
      - ALPACA_API_SECRET=${ALPACA_API_SECRET:-}
      - ALPACA_BASE_URL=${ALPACA_BASE_URL:-https://paper-api.alpaca.markets}
      # Broker API Credentials - Binance
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
      - BINANCE_BASE_URL=${BINANCE_BASE_URL:-https://testnet.binance.vision}
      # Service URLs
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8000
      - TRADING_SERVICE_URL=http://trading-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      # Application Settings
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-true}
      # Risk Management
      - MAX_RISK_PER_TRADE_PERCENT=${MAX_RISK_PER_TRADE_PERCENT:-5.0}
      - MAX_ACCOUNT_RISK_PERCENT=${MAX_ACCOUNT_RISK_PERCENT:-20.0}
      - MAX_TOTAL_POSITIONS=${MAX_TOTAL_POSITIONS:-10}
      - MAX_DAILY_LOSS_PERCENT=${MAX_DAILY_LOSS_PERCENT:-5.0}
      # Feature Flags
      - ENABLE_PAPER_TRADING=${ENABLE_PAPER_TRADING:-true}
      - ENABLE_LIVE_TRADING=${ENABLE_LIVE_TRADING:-false}
      - DRY_RUN_MODE=${DRY_RUN_MODE:-false}
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_started
      trading-service:
        condition: service_started
    volumes:
      - ./agents/executor-service:/app/agents/executor-service:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== AUTO-TRADING ENGINE ====================

  auto-trading-engine:
    build:
      context: .
      dockerfile: services/auto-trading-engine/Dockerfile
    container_name: terminal-auto-trading
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-trading_user}:${DB_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-terminal_db}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-trading}:${RABBITMQ_PASSWORD:-changeme}@rabbitmq:5672/
      # Service Integration URLs
      - MARKET_DATA_SERVICE_URL=http://market-data-service:8000
      - TECHNICAL_ANALYST_SERVICE_URL=http://technical-analyst-service:8000
      - EXECUTOR_SERVICE_URL=http://executor-service:8000
      - TRADING_SERVICE_URL=http://trading-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      # Application Settings
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-true}
      # Worker Intervals
      - SYMBOL_MONITOR_INTERVAL_SECONDS=5
      - POSITION_MONITOR_INTERVAL_SECONDS=5
      - SESSION_MANAGER_INTERVAL_SECONDS=60
      # Prometheus
      - ENABLE_PROMETHEUS_METRICS=true
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      market-data-service:
        condition: service_started
      technical-analyst-service:
        condition: service_started
      executor-service:
        condition: service_started
      trading-service:
        condition: service_started
      # TODO: Add when implemented: notification-service
    volumes:
      - ./services/auto-trading-engine:/app/services/auto-trading-engine:ro
      - ./shared:/app/shared:ro
    networks:
      - terminal_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==================== FRONTEND ====================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: terminal-frontend
    environment:
      - VITE_API_URL=http://localhost:8001
      - VITE_WS_URL=ws://localhost:8001/ws
    ports:
      - "3002:3000"  # Docker frontend on 3002, native on 3000
    depends_on:
      market-data-service:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - terminal_network
    stdin_open: true
    tty: true
    restart: unless-stopped

networks:
  terminal_network:
    driver: bridge
    name: terminal_network

volumes:
  postgres_data:
    name: terminal_postgres_data
  redis_data:
    name: terminal_redis_data
  rabbitmq_data:
    name: terminal_rabbitmq_data
  prometheus_data:
    name: terminal_prometheus_data
  grafana_data:
    name: terminal_grafana_data
